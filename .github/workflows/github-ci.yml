name: GitHub CI

on:
  push:
    branches: [ master, nightly ]
    tags: [ '**' ]
  pull_request:
    types: [ opened, synchronize, reopened ]

# A newer run of the same ref makes the in-flight one pointless: its result is
# already stale, yet it would still burn the full 4-job matrix (~60 runner
# minutes) to completion. Cancel it instead. The group is keyed on the ref, so
# two different PRs, two different tags, or a tag and master never cancel each
# other — only a re-push of an existing ref cancels its predecessor.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Gate for everything below: does this run touch code that a compiler, the
  # Rust linter or the packager can actually see? A pull request that only
  # moves markdown, documentation or repository metadata skips the matrix
  # below instead of burning ~60 runner minutes on a change no build reads.
  #
  # The verdict is deliberately one-sided. The filter is an exclusion list
  # over '**', so a path nobody thought of still runs the full pipeline —
  # forgetting to exclude something only costs minutes, while wrongly
  # excluding something would hide a broken build behind a green run.
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read # actions/checkout, push events only
      pull-requests: read # changed-file list of a pull request
    outputs:
      # Only an evaluated 'false' skips the jobs below. If the filter did
      # not run at all — tag push, first push of a branch — the empty string
      # counts as "we could not tell, so build it".
      code: ${{ steps.filter.outputs.code != 'false' }}
    steps:
    # Pull requests are read through the REST API and need no checkout.
    # Push events diff with git, so the pushed range has to be here; a
    # depth-1 checkout is enough, the action fetches the 'before' commit
    # itself when it is missing.
    - name: Checkout
      if: github.event_name == 'push'
      uses: actions/checkout@v5

    # A tag push (and the first push of a branch) has no previous commit to
    # diff against. Release builds are exactly the ones that must never be
    # filtered out, so let this step be skipped and fall through to the
    # fail-open output above.
    - name: Detect changed paths
      if: github.event_name == 'pull_request' || github.event.before != '0000000000000000000000000000000000000000'
      id: filter
      # Pinned like the other third-party action (setup-sdl), SHA of v4.0.3.
      uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
      with:
        # On push events: diff against the commit this push replaced, so a
        # push to nightly is measured against the previous nightly rather
        # than against master (the default base). On pull requests the input
        # is ignored and the API path is used instead.
        base: ${{ github.event.before }}
        predicate-quantifier: some-with-excludes
        filters: |
          # Everything counts as code except the documentation and
          # repository metadata below: markdown anywhere, docs/, GitHub
          # issue templates and bot config, and the handful of root files
          # that describe the project rather than build it. C++, Rust, the
          # build system, assets, tests and the CI scripts themselves are
          # all covered by '**' and therefore always run.
          code:
            - '**'
            - '!*.md'
            - '!**/*.md'
            - '!docs/**'
            - '!.github/ISSUE_TEMPLATE/**'
            - '!.github/CODEOWNERS'
            - '!.github/dependabot.yml'
            - '!.agents/**'
            - '!.editorconfig'
            - '!.gitignore'
            - '!.mailmap'
            - '!contributors.txt'
            - '!SFI Source Code license agreement.txt'

  ci-build:
    needs: changes
    # Docs- or metadata-only changes skip the whole build matrix; see the
    # 'changes' job for what counts as code.
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        cfg:
        - name: Linux
          os: ubuntu-22.04
          target: linux

        - name: Linux mingw64
          os: ubuntu-24.04
          target: linux-mingw64

        # macOS (macos-15-intel, macos-15 arm64) and Android are deliberately
        # absent on this fork — we only ship desktop Windows and Linux builds.
        # macOS arm64 runners also queue slowly (GitHub capacity limits).
        # The Android job needs ANDROID_KEYSTORE_FILE / ANDROID_KEYSTORE_PASSWORD,
        # which this fork does not have, so it was permanently red and blocked
        # every PR. Restore these entries if any of that changes. Note Linux
        # stays: it is what catches platform-specific breakage such as
        # Windows-only type names.

    name: ${{ matrix.cfg.name }}
    runs-on: ${{ matrix.cfg.os }}
    steps:
    # No "Free Disk Space" step — it was only ever needed by the Android build
    # this fork dropped in #26, and it was not free: ~100 s of every job, a
    # fifth of the Linux job, to reclaim space that never gets used. df at job
    # start shows 86 GiB available of a 151 GiB disk, while the whole build —
    # Debug tree, restored sccache + Rust caches, AppImage staging — needs
    # single-digit GiB. If a run ever does exhaust the disk, narrow what gets
    # cleaned rather than restoring a blanket wipe.
    - name: Context in env
      env:
        GITHUB_CONTEXT: ${{ toJson(github) }}
        JOB_CONTEXT: ${{ toJson(job) }}
        STEPS_CONTEXT: ${{ toJson(steps) }}
        RUNNER_CONTEXT: ${{ toJson(runner) }}
        STRATEGY_CONTEXT: ${{ toJson(strategy) }}
        MATRIX_CONTEXT: ${{ toJson(matrix) }}
      run: ''

    - name: Checkout
      uses: actions/checkout@v5

    # The -vN suffix tracks the sccache version installed by ci-setup.sh: bump it
    # whenever that pin changes so a run never restores a cache written by a
    # different sccache build. It is currently v2 (sccache v0.18.0).
    #
    # Both caches are only *restored* here; they are saved later, from the
    # default branch only. A cache written by a pull request is scoped to that
    # PR's merge ref, so no other run can ever read it: writing one per push
    # just fills the repository's 10 GB cache budget without ever producing a
    # hit (the budget was already exceeded, and 7.8 GB of it was unreusable
    # per-PR sccache entries). The default branch is the shared seed every run
    # restores from.
    - name: Restore compiler cache (sccache)
      id: sccache
      uses: actions/cache/restore@v5
      with:
        path: |
          ~/.cache/sccache
        key: ${{ matrix.cfg.target }}-sccache-v2-${{ github.ref }}-${{ github.sha }}
        restore-keys: |
          ${{ matrix.cfg.target }}-sccache-v2-${{ github.ref }}-
          ${{ matrix.cfg.target }}-sccache-v2-refs/heads/master-
          ${{ matrix.cfg.target }}-sccache-v2-
    - name: Restore Rust deps and build output
      id: rust
      uses: actions/cache/restore@v5
      with:
        path: |
          ~/.cargo/bin
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          ~/.rustup
        key: ${{ matrix.cfg.target }}-rust-v2-${{ hashFiles('rust') }}
        restore-keys: |
          ${{ matrix.cfg.target }}-rust-v2-${{ hashFiles('rust') }}
          ${{ matrix.cfg.target }}-rust-v2-

    - uses: libsdl-org/setup-sdl@a966470e7d9b6a5c93eec3f08d5dac370325c860
      if: matrix.cfg.target == 'linux'
      id: sdl
      with:
        install-linux-dependencies: true
        add-to-environment: true
        version: 3-latest

    - name: Set up environment
      shell: bash
      run: |
        . ${{ github.workspace }}/.ci/ci-setup.sh 2>&1
        echo "PATH=$PATH" >> $GITHUB_ENV
      env:
        CI_TARGET: ${{ matrix.cfg.target }}
        TARGET_GCC_MAJOR_VERSION: 10

    - name: Build and run tests
      shell: bash
      run: ${{ github.workspace }}/.ci/ci-build.sh 2>&1
      env:
        CI_NAME: ${{ matrix.cfg.name }}
        CI_OS: ${{ matrix.cfg.os }}
        CI_TARGET: ${{ matrix.cfg.target }}
        CI_REF: ${{ github.ref }}
        GITHUB_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # Saved after the build so the entries it just produced are included, and
    # only from the default branch so PR runs never fill the cache budget with
    # entries nothing can restore; see the restore steps above. The Rust key is
    # content-addressed, so its save is skipped when it already hit exactly.
    - name: Save compiler cache (sccache)
      if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      uses: actions/cache/save@v5
      continue-on-error: true
      with:
        path: |
          ~/.cache/sccache
        key: ${{ steps.sccache.outputs.cache-primary-key }}
    - name: Save Rust deps and build output
      if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.rust.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      continue-on-error: true
      with:
        path: |
          ~/.cargo/bin
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          ~/.rustup
        key: ${{ steps.rust.outputs.cache-primary-key }}

    - name: Publish packages
      shell: bash
      working-directory: ${{ github.workspace }}
      run: ${{ github.workspace }}/.ci/ci-publish.sh 2>&1
      env:
        CI_REF: ${{ github.ref }}
        CI_TARGET: ${{ matrix.cfg.target }}
        GCLOUD_CREDENTIALS_SALT: ${{ secrets.GCLOUD_CREDENTIALS_SALT }}
        GCLOUD_CREDENTIALS_KEY: ${{ secrets.GCLOUD_CREDENTIALS_KEY }}
        GCLOUD_CREDENTIALS_IV: ${{ secrets.GCLOUD_CREDENTIALS_IV }}

    # A sanitized Linux build has nothing to package (see ci-build.sh: the
    # AppImage step is skipped for it), so the glob can legitimately match
    # zero files. nullglob turns "no match" into an empty loop instead of the
    # literal pattern, which cp would fail on.
    - name: Collect artifacts
      shell: bash
      run: |
        set -e
        set -x
        mkdir artifacts
        shopt -s nullglob
        files=(ci-build/ja2-pecel-bakwan_*)
        echo "${#files[@]} package(s)"
        for file in "${files[@]}"; do
          cp "${file}" artifacts/
        done
    - name: Upload artifacts
      uses: actions/upload-artifact@v6
      with:
        name: artifacts ${{ matrix.cfg.name }}
        path: ${{ github.workspace }}/artifacts
        if-no-files-found: ignore

  ci-lint:
    needs: changes
    # Same gate as the build: cargo fmt and clippy only have something to
    # say about code changes, so a documentation-only PR skips them too.
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        cfg:
        - name: linux
          os: ubuntu-latest
          target: linux

        # macOS lint entries removed along with the macOS build matrix; fmt and
        # clippy are platform-independent, so one Unix and one Windows job cover
        # the toolchain differences that matter.
        - name: windows
          os: windows-latest
          target: windows
    name: lint ${{ matrix.cfg.name }}
    runs-on: ${{ matrix.cfg.os }}
    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Install rustup
      shell: bash
      run: |
        curl --proto '=https' --tlsv1.2 -sSfL https://sh.rustup.rs | sh -s -- -y --default-toolchain=$(cat ./min-rust-version)

    - name: Run cargo fmt
      shell: bash
      working-directory: ./rust
      run: cargo fmt --verbose --all --check

    - name: Run cargo clippy
      shell: bash
      working-directory: ./rust
      run: cargo clippy --all-targets --all-features --verbose -- -D warnings
